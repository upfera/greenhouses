name: CI

on:
  push:
    # A branch with an open pull request is covered by `pull_request`; without this
    # filter every commit to it runs the whole job twice.
    branches: [main]
  pull_request:

# Minimum permissions for the workflow, read-only. Jobs and steps that need
# more declare it at the narrowest scope that uses it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # No job-scoped permissions: the workflow-level `contents: read` covers the checkout,
    # the test run and the artifact upload. Nothing publishes a check run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Sync
        run: uv sync --locked --group test --no-build
      - name: Lint
        run: uv run --locked --group test --no-build ruff check .
      - name: Format
        run: uv run --locked --group test --no-build ruff format --check .
      - name: Types
        run: uv run --locked --group test --no-build mypy src
      - name: Tests
        run: |
          # pytest-cov and pytest-html write into an existing directory only.
          mkdir -p reports
          uv run --locked --group test --no-build pytest \
            --cov \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=markdown:reports/coverage.md \
            --junitxml=junit.xml \
            --html=reports/tests.html --self-contained-html
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Reporting runs after the gates so a failure here can never skip them, and
      # each step is `if: ${{ !cancelled() }}` so the report, artifacts and summary
      # survive a failing test run without running after a cancelled one.
      - name: Summary
        if: ${{ !cancelled() }}
        # A short report in the run summary: the test counts with the failing tests,
        # and the coverage table pytest-cov wrote underneath.
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = []
          if Path("junit.xml").exists():
              root = ET.parse("junit.xml").getroot()
              suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
              total = sum(int(s.get("tests", 0)) for s in suites)
              failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              seconds = sum(float(s.get("time", 0)) for s in suites)
              passed = total - failed - skipped
              icon = "\u274c" if failed else "\u2705"
              out.append(f"### {icon} Tests: {passed} passed, {failed} failed, {skipped} skipped")
              out.append("| Total | \u2705 Passed | \u274c Failed | \u23ed\ufe0f Skipped | \u23f1\ufe0f Duration |")
              out.append("|---:|---:|---:|---:|---:|")
              out.append(f"| {total} | {passed} | {failed} | {skipped} | {seconds:.2f}s |")
              names = [
                  f"{c.get('classname', '')}::{c.get('name', '')}".lstrip(":")
                  for s in suites
                  for c in s.findall("testcase")
                  if c.find("failure") is not None or c.find("error") is not None
              ]
              if names:
                  out += ["", "<details><summary>\u274c Failing tests</summary>", ""]
                  out += [f"- `{n}`" for n in names]
                  out += ["", "</details>"]
          if Path("reports/coverage.md").exists():
              out += ["", "### \U0001f4ca Coverage", Path("reports/coverage.md").read_text(encoding="utf-8").strip()]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-and-coverage-reports
          path: |
            junit.xml
            coverage.xml
            htmlcov/
            reports/
          retention-days: 7

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Add uv tool binary directory to PATH
        run: uv tool dir --bin >> "$GITHUB_PATH"
      - name: Install
        run: ./install.sh
      - name: Verify installed CLI from outside the repository
        run: |
          tmp_dir="$(mktemp -d)"
          echo "tmp_dir=$tmp_dir" >> "$GITHUB_ENV"
          cd "$tmp_dir"
          greenhouses --version
          test "$(greenhouses --version)" = "0.1.0"
          greenhouses --help
          code=0
          greenhouses --unknown 2> stderr.txt || code=$?
          test "$code" -eq 2
          test -s stderr.txt
      - name: Verify the declared uv floor with real uv
        run: |
          set -eu
          # 0.13.0 is the declared floor. Below it `--no-build` also blocks building this project
          # from source, so both ends are exercised with real uv, not with the fake one.
          UV_TOOL_DIR="$RUNNER_TEMP/uv-below/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-below/bin" \
            uv tool install --no-build "uv==0.12.24"
          UV_TOOL_DIR="$RUNNER_TEMP/uv-floor/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-floor/bin" \
            uv tool install --no-build "uv==0.13.0"
          if output=$(PATH="$RUNNER_TEMP/uv-below/bin:$PATH" ./install.sh 2>&1); then
            echo "error: uv 0.12.24 was accepted" >&2
            exit 1
          fi
          case "$output" in
            *0.13.0*) ;;
            *) echo "error: the refusal did not name the required version" >&2; exit 1 ;;
          esac
          PATH="$RUNNER_TEMP/uv-floor/bin:$PATH" ./install.sh
      - name: Remove temporary directory
        if: always()
        run: |
          if [ -n "${tmp_dir:-}" ]; then
            rm -rf "$tmp_dir"
          fi
