name: CI

on:
  push:
  pull_request:

# Minimum permissions for the workflow, read-only. Jobs and steps that need
# more declare it at the narrowest scope that uses it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Scoped to the steps that use it, on top of the workflow-level `contents: read`:
    #   checks: write  - publish the test report as a check run
    # The reporter reads the local `junit.xml` and takes the run context from the
    # environment, so it needs no `actions: read`. That permission is for fetching a
    # report as an artifact from another workflow run, which this workflow does not do.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Sync
        run: uv sync --locked --group test --no-build
      - name: Lint
        run: uv run --locked --group test --no-build ruff check .
      - name: Format
        run: uv run --locked --group test --no-build ruff format --check .
      - name: Types
        run: uv run --locked --group test --no-build mypy src
      - name: Tests
        run: uv run --locked --group test --no-build pytest --cov --cov-report=xml --junitxml=junit.xml
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Reporting runs after the gates so a failure here can never skip them, and
      # each step is `if: ${{ !cancelled() }}` so the report, artifacts and summary
      # survive a failing test run without running after a cancelled one.
      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Test results
          path: junit.xml
          reporter: python-xunit
          # `fail-on-error` keeps its default of true, deliberately: the action fails this
          # step when the report holds a failing test, and the check run's conclusion
          # follows it. Setting it false was measured on a scratch branch and turns the
          # check green while the suite is red, which would defeat the point of the check.
          # The extra red step is the cost of a red check.
          # An empty report (the suite never ran, e.g. a lint failure) is not itself a test
          # failure; the Tests step already owns the run's outcome.
          fail-on-empty: false
          # Keep $GITHUB_STEP_SUMMARY short; the check run carries the per-test detail.
          use-actions-summary: false
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-and-coverage-reports
          path: |
            junit.xml
            coverage.xml
          retention-days: 7
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          lines = []

          if os.path.exists("junit.xml"):
              root = ET.parse("junit.xml").getroot()
              suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
              tests = sum(int(s.get("tests", 0)) for s in suites)
              failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              lines.append(f"Tests: {tests - failed - skipped} passed, {failed} failed, {skipped} skipped")
          else:
              lines.append("Tests: no JUnit report was produced")

          if os.path.exists("coverage.xml"):
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate", "0"))
              lines.append(f"Coverage: {rate * 100:.1f}% of lines")
          else:
              lines.append("Coverage: no report was produced")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### CI summary\n\n")
              summary.write("\n".join(f"- {line}" for line in lines))
              summary.write("\n")
          PY

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Add uv tool binary directory to PATH
        run: uv tool dir --bin >> "$GITHUB_PATH"
      - name: Install
        run: ./install.sh
      - name: Verify installed CLI from outside the repository
        run: |
          tmp_dir="$(mktemp -d)"
          echo "tmp_dir=$tmp_dir" >> "$GITHUB_ENV"
          cd "$tmp_dir"
          greenhouses --version
          test "$(greenhouses --version)" = "0.1.0"
          greenhouses --help
          code=0
          greenhouses --unknown 2> stderr.txt || code=$?
          test "$code" -eq 2
          test -s stderr.txt
      - name: Verify the declared uv floor with real uv
        run: |
          set -eu
          # 0.13.0 is the declared floor. Below it `--no-build` also blocks building this project
          # from source, so both ends are exercised with real uv, not with the fake one.
          UV_TOOL_DIR="$RUNNER_TEMP/uv-below/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-below/bin" \
            uv tool install --no-build "uv==0.12.24"
          UV_TOOL_DIR="$RUNNER_TEMP/uv-floor/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-floor/bin" \
            uv tool install --no-build "uv==0.13.0"
          if output=$(PATH="$RUNNER_TEMP/uv-below/bin:$PATH" ./install.sh 2>&1); then
            echo "error: uv 0.12.24 was accepted" >&2
            exit 1
          fi
          case "$output" in
            *0.13.0*) ;;
            *) echo "error: the refusal did not name the required version" >&2; exit 1 ;;
          esac
          PATH="$RUNNER_TEMP/uv-floor/bin:$PATH" ./install.sh
      - name: Remove temporary directory
        if: always()
        run: |
          if [ -n "${tmp_dir:-}" ]; then
            rm -rf "$tmp_dir"
          fi
