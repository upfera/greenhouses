name: CI

on:
  push:
  pull_request:

# Minimum permissions for the workflow, read-only. Jobs and steps that need
# more declare it at the narrowest scope that uses it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Scoped to the steps that use them, on top of the workflow-level `contents: read`:
    #   checks: write        - publish the test report as a check run
    #   code-quality: write  - upload the coverage report to GitHub Code Quality, which
    #                          then comments the coverage summary on the pull request.
    # The JUnit report is converted to CTRF first, because that is the format the test
    # reporter consumes; no other third-party reporting action is used.
    permissions:
      contents: read
      checks: write
      code-quality: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Sync
        run: uv sync --locked --group test --no-build
      - name: Lint
        run: uv run --locked --group test --no-build ruff check .
      - name: Format
        run: uv run --locked --group test --no-build ruff format --check .
      - name: Types
        run: uv run --locked --group test --no-build mypy src
      - name: Tests
        run: uv run --locked --group test --no-build pytest --cov --cov-report=xml --cov-report=html --junitxml=junit.xml
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Reporting runs after the gates so a failure here can never skip them, and
      # each step is `if: ${{ !cancelled() }}` so the report, artifacts and summary
      # survive a failing test run without running after a cancelled one.
      - name: Convert the JUnit report to CTRF
        if: ${{ !cancelled() }}
        run: |
          if [ -f junit.xml ]; then
            npx --yes junit-to-ctrf junit.xml -o ctrf/ctrf-report.json
          else
            echo "no junit.xml to convert"
          fi
      - name: Publish test report
        # Skipped for pull requests from forks: those runs get a read-only token.
        if: ${{ !cancelled() && hashFiles('ctrf/ctrf-report.json') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
        with:
          report-path: ctrf/ctrf-report.json
      - name: Upload coverage report
        # Skipped for pull requests from forks: those runs get a read-only token.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          # Code Quality must be enabled for this repository first (Settings, Security,
          # Code quality); the plan already allows it. Until it is enabled the upload
          # answers 403, and a warning is the honest outcome: the coverage report is still
          # published as an artifact and in the summary below.
          fail-on-error: false
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-and-coverage-reports
          path: |
            junit.xml
            coverage.xml
            htmlcov/
            ctrf/
          retention-days: 7
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          lines = []

          if os.path.exists("junit.xml"):
              root = ET.parse("junit.xml").getroot()
              suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
              cases = [c for s in suites for c in s.findall("testcase")]
              broken = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
              tests = sum(int(s.get("tests", 0)) for s in suites)
              failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              lines.append(f"Tests: {tests - failed - skipped} passed, {failed} failed, {skipped} skipped")
              if broken:
                  # The artifact holds the detail; this names what failed without a download.
                  names = ", ".join(c.get("name", "?") for c in broken[:5])
                  lines.append(f"Failed: {names}" + (" and more" if len(broken) > 5 else ""))
          else:
              lines.append("Tests: no JUnit report was produced")

          if os.path.exists("coverage.xml"):
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate", "0"))
              lines.append(f"Coverage: {rate * 100:.1f}% of lines")
          else:
              lines.append("Coverage: no report was produced")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### CI summary\n\n")
              summary.write("\n".join(f"- {line}" for line in lines))
              summary.write("\n")
          PY

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Add uv tool binary directory to PATH
        run: uv tool dir --bin >> "$GITHUB_PATH"
      - name: Install
        run: ./install.sh
      - name: Verify installed CLI from outside the repository
        run: |
          tmp_dir="$(mktemp -d)"
          echo "tmp_dir=$tmp_dir" >> "$GITHUB_ENV"
          cd "$tmp_dir"
          greenhouses --version
          test "$(greenhouses --version)" = "0.1.0"
          greenhouses --help
          code=0
          greenhouses --unknown 2> stderr.txt || code=$?
          test "$code" -eq 2
          test -s stderr.txt
      - name: Verify the declared uv floor with real uv
        run: |
          set -eu
          # 0.13.0 is the declared floor. Below it `--no-build` also blocks building this project
          # from source, so both ends are exercised with real uv, not with the fake one.
          UV_TOOL_DIR="$RUNNER_TEMP/uv-below/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-below/bin" \
            uv tool install --no-build "uv==0.12.24"
          UV_TOOL_DIR="$RUNNER_TEMP/uv-floor/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-floor/bin" \
            uv tool install --no-build "uv==0.13.0"
          if output=$(PATH="$RUNNER_TEMP/uv-below/bin:$PATH" ./install.sh 2>&1); then
            echo "error: uv 0.12.24 was accepted" >&2
            exit 1
          fi
          case "$output" in
            *0.13.0*) ;;
            *) echo "error: the refusal did not name the required version" >&2; exit 1 ;;
          esac
          PATH="$RUNNER_TEMP/uv-floor/bin:$PATH" ./install.sh
      - name: Remove temporary directory
        if: always()
        run: |
          if [ -n "${tmp_dir:-}" ]; then
            rm -rf "$tmp_dir"
          fi
