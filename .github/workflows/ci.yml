name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.9"
      - name: Sync
        run: uv sync --locked --group test --no-build
      - name: Lint
        run: uv run --locked --group test --no-build ruff check .
      - name: Format
        run: uv run --locked --group test --no-build ruff format --check .
      - name: Types
        run: uv run --locked --group test --no-build mypy src
      - name: Tests
        run: uv run --locked --group test --no-build pytest --cov --cov-report=xml
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.9"
      - name: Add uv tool binary directory to PATH
        run: uv tool dir --bin >> "$GITHUB_PATH"
      - name: Install
        run: ./install.sh
      - name: Verify installed CLI from outside the repository
        run: |
          tmp_dir="$(mktemp -d)"
          echo "tmp_dir=$tmp_dir" >> "$GITHUB_ENV"
          cd "$tmp_dir"
          greenhouses --version
          test "$(greenhouses --version)" = "0.1.0"
          greenhouses --help
          code=0
          greenhouses --unknown 2> stderr.txt || code=$?
          test "$code" -eq 2
          test -s stderr.txt
      - name: Remove temporary directory
        if: always()
        run: |
          if [ -n "${tmp_dir:-}" ]; then
            rm -rf "$tmp_dir"
          fi
