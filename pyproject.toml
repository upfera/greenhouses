[project]
name = "greenhouses"
version = "0.1.0"
description = "Vendor-neutral platform for supervised automations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
greenhouses = "greenhouses.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenhouses"]

[dependency-groups]
test = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-html>=4.2.0",
    "ruff>=0.6",
]

# The same floor the installer enforces, so `uv sync` and `uv run` refuse a
# below-floor or pre-release uv with uv's own message (PEP 440 specifier).
[tool.uv]
required-version = ">=0.13.0"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["greenhouses"]
